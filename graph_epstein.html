<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #0a0a0c; font-family: -apple-system, sans-serif; overflow: hidden; }
  #topbar { position: absolute; top: 16px; left: 16px; z-index: 10; display: flex; gap: 8px; align-items: center; }
  #search { background: #17171a; border: 1px solid #2a2a2e; color: #eee; padding: 9px 14px; border-radius: 20px; font-size: 13px; width: 200px; outline: none; }
  #search:focus { border-color: #5b8dd9; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #999; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  svg { width: 100vw; height: 100vh; display: block; }
  .link { stroke: #35353a; stroke-opacity: 0.55; fill: none; transition: opacity 0.3s, stroke 0.3s; }
  .link.dim { opacity: 0.04; }
  .linklabel { fill: #666; font-size: 9px; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  .linklabel.show { opacity: 1; }
  .node circle { cursor: pointer; transition: opacity 0.3s, filter 0.2s; stroke: #0a0a0c; stroke-width: 1.5px; }
  .node circle:hover { filter: brightness(1.25); }
  .node circle.dim { opacity: 0.1; }
  .node text { fill: #ccc; font-size: 11px; pointer-events: none; transition: opacity 0.3s; }
  .node text.dim { opacity: 0.1; }
  #panel { position: absolute; top: 0; right: -380px; width: 360px; height: 100vh; background: #131316; border-left: 1px solid #232326; padding: 28px 22px; box-sizing: border-box; overflow-y: auto; transition: right 0.4s cubic-bezier(.2,.8,.2,1); color: #eee; z-index: 20; }
  #panel.open { right: 0; }
  #panel .tag { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 12px; margin-bottom: 12px; }
  #panel h2 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
  #panel .meta { color: #888; font-size: 12px; margin-bottom: 22px; }
  #panel .mention { background: #1b1b1f; border-radius: 10px; padding: 13px; margin-bottom: 10px; border-left: 2px solid #333; }
  #panel .mention .rel { color: #6ba3e8; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  #panel .mention .quote { color: #aaa; font-size: 13px; margin-top: 6px; line-height: 1.55; }
  #panel .close { position: absolute; top: 22px; right: 22px; cursor: pointer; color: #888; font-size: 20px; background: none; border: none; }
  #panel .close:hover { color: #eee; }
</style>
</head>
<body>
  <div id="topbar">
    <input id="search" placeholder="Search a name...">
    <div class="legend">
      <span><i class="dot" style="background:#5b8dd9"></i>Person</span>
      <span><i class="dot" style="background:#5cb88a"></i>Organization</span>
      <span><i class="dot" style="background:#c98a4a"></i>Legal case</span>
    </div>
  </div>
  <svg id="graph"></svg>
  <div id="panel">
    <button class="close" onclick="closePanel()">&times;</button>
    <div class="tag" id="panel-tag"></div>
    <h2 id="panel-name"></h2>
    <div class="meta" id="panel-type"></div>
    <div id="panel-mentions"></div>
  </div>

  <script src="https://unpkg.com/d3@7"></script>
  <script>
    const typeColors = { person: '#5b8dd9', organization: '#5cb88a', legal_case: '#c98a4a', law_firm: '#5cb88a', document: '#888', location: '#a877d9' };

    fetch('graph_data_epstein.json').then(r => r.json()).then(data => {
      const degree = {};
      data.nodes.forEach(n => degree[n.id] = 0);
      data.links.forEach(l => { degree[l.source] = (degree[l.source]||0)+1; degree[l.target] = (degree[l.target]||0)+1; });

      // find the hub (highest degree) to anchor the radial layout
      const hub = data.nodes.reduce((a,b) => (degree[a.id]||0) > (degree[b.id]||0) ? a : b);

      const linkCounts = {};
      data.links.forEach(l => {
        const key = [l.source, l.target].sort().join("|");
        linkCounts[key] = (linkCounts[key] || 0) + 1;
      });

      const W = 2200, H = 1500;
      const svg = d3.select("#graph");
      const g = svg.append("g");
      svg.call(d3.zoom().scaleExtent([0.15, 4]).on("zoom", e => g.attr("transform", e.transform)));
      
      // radial ring by degree: hub at center, rings by connection strength
      data.nodes.forEach(n => {
        const isHub = n.id === hub.id;
        const ring = isHub ? 0 : Math.max(1, 4 - Math.min(3, Math.floor((degree[n.id]||0)/2)));
        const angle = Math.random() * 2 * Math.PI;
        const radius = ring * 220;
        n.x = W/2 + Math.cos(angle) * radius;
        n.y = H/2 + Math.sin(angle) * radius;
      });

      const sim = d3.forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.links).id(d => d.id).distance(130).strength(0.3))
        .force("charge", d3.forceManyBody().strength(-700).distanceMax(500))
        .force("x", d3.forceX(W/2).strength(d => d.id === hub.id ? 0.3 : 0.02))
        .force("y", d3.forceY(H/2).strength(d => d.id === hub.id ? 0.3 : 0.02))
        .force("collide", d3.forceCollide(d => 16 + (degree[d.id]||0)*2.2))
        .alphaDecay(0.025)
        .velocityDecay(0.5);

      const link = g.append("g").selectAll("path")
        .data(data.links).join("path").attr("class", "link")
        .attr("stroke-width", d => {
          const key = [d.source, d.target].sort().join("|");
          return Math.min(1 + linkCounts[key]*0.5, 3.5);
        });

      const linkLabel = g.append("g").selectAll("text")
        .data(data.links).join("text").attr("class", "linklabel")
        .text(d => d.type);

      const node = g.append("g").selectAll("g")
        .data(data.nodes).join("g").attr("class", "node")
        .call(d3.drag()
          .on("start", (e,d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
          .on("drag", (e,d) => { d.fx=e.x; d.fy=e.y; })
          .on("end", (e,d) => { if (!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

      node.each(function(d) {
        const el = d3.select(this);
        const r = (d.id === hub.id ? 10 : 5) + Math.sqrt(degree[d.id]||0)*3.5;
        const color = typeColors[d.type] || '#888';
        if (d.type === 'organization' || d.type === 'law_firm') {
          const pts = Array.from({length:6}, (_,i) => {
            const a = Math.PI/3*i - Math.PI/2;
            return `${r*Math.cos(a)},${r*Math.sin(a)}`;
          }).join(' ');
          el.append('polygon').attr('points', pts).attr('fill', color).attr('opacity', 0)
            .transition().duration(800).delay(500).attr('opacity', 1);
        } else if (d.type === 'legal_case') {
          el.append('polygon').attr('points', `0,-${r} ${r},0 0,${r} -${r},0`).attr('fill', color).attr('opacity', 0)
            .transition().duration(800).delay(500).attr('opacity', 1);
        } else {
          el.append('circle').attr('r', 0).attr('fill', color)
            .transition().duration(800).delay(500).attr('r', r);
        }
      });
      node.append("text")
        .attr("dx", d => 8 + ((d.id === hub.id ? 10 : 5) + Math.sqrt(degree[d.id]||0)*3.5))
        .attr("dy", 4)
        .text(d => d.id)
        .style("opacity", 0)
        .transition().duration(800).delay((d,i) => i*10 + 400)
        .style("opacity", 1);

      let hoveredLinks = new Set();
      node.on("click", (e, d) => openPanel(d));
      node.on("mouseenter", (e,d) => {
        linkLabel.classed('show', l => l.source.id===d.id || l.target.id===d.id);
      });
      node.on("mouseleave", () => linkLabel.classed('show', false));

      sim.on("tick", () => {
        link.attr("d", d => {
          const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
          const dr = Math.sqrt(dx*dx + dy*dy) * 1.3;
          return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
        });
        linkLabel.attr("x", d => (d.source.x + d.target.x)/2).attr("y", d => (d.source.y + d.target.y)/2);
        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });
      setTimeout(() => {
        const bounds = g.node().getBBox();
        const scale = Math.min(0.9, 900 / Math.max(bounds.width, bounds.height));
        const tx = window.innerWidth/2 - (bounds.x + bounds.width/2) * scale;
        const ty = window.innerHeight/2 - (bounds.y + bounds.height/2) * scale;
        svg.transition().duration(750).call(d3.zoom().transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
      }, 1200);

      function openPanel(d) {
        const color = typeColors[d.type] || '#888';
        const tag = document.getElementById('panel-tag');
        tag.textContent = d.type;
        tag.style.background = color + '22';
        tag.style.color = color;
        document.getElementById('panel-name').textContent = d.id;
        document.getElementById('panel-type').textContent = `${degree[d.id]||0} connections`;
        const mDiv = document.getElementById('panel-mentions');
        mDiv.innerHTML = '';
        (d.mentions || []).forEach(m => {
          mDiv.innerHTML += `<div class="mention"><div class="rel">${m.relation}</div><div class="quote">"${m.quote}"</div></div>`;
        });
        if (!d.mentions || !d.mentions.length) mDiv.innerHTML = '<i style="color:#666">No details recorded</i>';
        document.getElementById('panel').classList.add('open');
        link.classed('dim', l => l.source.id !== d.id && l.target.id !== d.id);
        node.selectAll('circle, text').classed('dim', n2 => {
          const connected = data.links.some(l => (l.source.id===d.id && l.target.id===n2.id) || (l.target.id===d.id && l.source.id===n2.id));
          return n2.id !== d.id && !connected;
        });
      }
      window.closePanel = () => {
        document.getElementById('panel').classList.remove('open');
        link.classed('dim', false);
        node.selectAll('circle, text').classed('dim', false);
      };

      document.getElementById('search').oninput = (e) => {
        const q = e.target.value.toLowerCase();
        if (!q) { node.selectAll('circle,text').classed('dim', false); link.classed('dim', false); return; }
        node.selectAll('circle,text').classed('dim', function() {
          return !d3.select(this.parentNode).datum().id.toLowerCase().includes(q);
        });
      };
    });
  </script>
</body>
</html>
